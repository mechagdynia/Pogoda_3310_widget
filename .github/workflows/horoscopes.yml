name: Update daily horoscopes

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-horoscopes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch and translate all zodiac signs
        env:
          API_NINJAS_API_KEY: ${{ secrets.API_NINJAS_API_KEY }}
        run: node tools/update_horoscopes.mjs
      - name: Commit fresh horoscope data
        shell: bash
        run: |
          if git diff --quiet -- public/data/horoscopes.json; then
            echo "Horoscope data is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/data/horoscopes.json
          git commit -m "data: update daily horoscopes"
          git push
